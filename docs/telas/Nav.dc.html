<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Navegação Athenaeum</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<nav aria-label="Principal" style="width: 100%; height: 100%; min-height: 100%; background: var(--surface); border-right: 1px solid var(--hairline); padding: 28px 16px; display: flex; flex-direction: column; gap: 32px; font-family: var(--font-sans); color: var(--ink); box-sizing: border-box;">
  <a href="Main.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 0 8px; text-decoration: none; color: var(--ink);">
    <span style="width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--accent); display: grid; place-items: center; font-family: var(--font-display); font-size: 22px; font-weight: 600; color: var(--accent);">A</span>
    <span style="display: flex; flex-direction: column;">
      <span style="font-family: var(--font-display); font-size: 24px; line-height: 26px; font-weight: 600;">Athenaeum</span>
      <span class="label" style="font-size: 10px;">Estudos de Renan</span>
    </span>
  </a>
  <div style="display: flex; flex-direction: column; gap: 4px;">
    <sc-for list="{{items}}" as="item" hint-placeholder-count="6">
      <a href="{{item.href}}" aria-current="{{item.current}}" style="{{item.style}}">
        <svg class="ico" viewBox="0 0 24 24"><path d="{{item.d}}"></path></svg>
        <span>{{item.label}}</span>
      </a>
    </sc-for>
  </div>
  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 12px;">
    <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border: 1px solid var(--hairline); border-radius: 16px;">
      <span style="width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--accent); color: var(--accent); display: grid; place-items: center;"><svg class="ico" viewBox="0 0 24 24" style="width: 18px; height: 18px;"><path d="M12 3c2 4 6 5 6 10a6 6 0 0 1-12 0c0-3 2-4 2-7 2 1 3 3 4 3"></path></svg></span>
      <span style="display: flex; flex-direction: column;"><span class="mono" style="font-size: 16px; line-height: 20px;">7 dias</span><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">sequência ativa</span></span>
    </div>
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 8px; font-size: 13px; line-height: 18px; color: var(--ink-muted);"><span style="width: 8px; height: 8px; border-radius: 50%; background: var(--success);"></span>Google Agenda sincronizada</div>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","tasks","calendar","goals","focus","settings"],"default":"dashboard"},"$preview":{"width":248,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    var active = this.props.active ?? 'dashboard';
    var base = 'display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 10px 12px; border-radius: 10px; text-decoration: none; font-size: 15px; font-weight: 600; transition: background-color 160ms;';
    var list = [
      { id: 'dashboard', label: 'Dashboard', href: 'Main.dc.html', d: 'M3 3h7v9H3z M14 3h7v5h-7z M14 12h7v9h-7z M3 16h7v5H3z' },
      { id: 'tasks', label: 'Tarefas', href: 'Tasks.dc.html', d: 'M9 11l3 3 8-8 M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11' },
      { id: 'calendar', label: 'Calendário', href: 'Calendar.dc.html', d: 'M8 2v4 M16 2v4 M3 9h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z' },
      { id: 'goals', label: 'Metas', href: 'Goals.dc.html', d: 'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M12 18a6 6 0 1 0 0-12 6 6 0 0 0 0 12z M12 14a2 2 0 1 0 0-4 2 2 0 0 0 0 4z' },
      { id: 'focus', label: 'Foco', href: 'Focus.dc.html', d: 'M10 2h4 M12 14l3-3 M12 22a8 8 0 1 0 0-16 8 8 0 0 0 0 16z' },
      { id: 'settings', label: 'Personalização', href: 'Settings.dc.html', d: 'M12 22a10 10 0 1 1 10-10c0 3-2 4-4 4h-2a2 2 0 0 0-1 4c.5 1 0 2-3 2z M7.5 10.5h.01 M12 7.5h.01 M16.5 10.5h.01' }
    ];
    return {
      items: list.map(function (it) {
        var on = it.id === active;
        return Object.assign({}, it, {
          current: on ? 'page' : 'false',
          style: base + (on ? ' background: var(--brand); color: var(--ink);' : ' color: var(--ink-muted);')
        });
      })
    };
  }
}
</script>
</body>
</html>
