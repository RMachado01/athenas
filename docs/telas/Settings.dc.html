<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Personalização — Athenaeum</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="theme.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
</style>
</helmet>
<div class="app" data-theme="{{theme}}" style="display: flex; flex-wrap: wrap; align-items: stretch;">
  <div style="flex: 1 1 248px; min-height: 100vh; display: flex;"><dc-import name="Nav" active="settings" hint-size="248px,100vh"></dc-import></div>
  <main style="flex: 999 1 560px; min-width: 0; padding: 48px clamp(16px, 4vw, 56px); display: flex; flex-direction: column; gap: 32px; max-width: 1040px;">
    <header style="display: flex; flex-direction: column; gap: 8px;">
      <span class="label">Do seu jeito</span>
      <h1 class="disp" style="margin: 0; font-size: 44px; line-height: 50px;">Personalização</h1>
      <div class="rule2" style="width: 72px; margin-top: 8px;" aria-hidden="true"></div>
    </header>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;" aria-labelledby="h-tema">
      <div><h2 id="h-tema" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Tema</h2><p style="margin: 4px 0 0; font-size: 13px; color: var(--ink-muted);">Troca na hora, com transição suave. Clique pra testar.</p></div>
      <div role="radiogroup" aria-label="Tema" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px;">
        <sc-for list="{{themes}}" as="t" hint-placeholder-count="4">
          <button role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" style="{{t.box}}">
            <span style="display: flex; height: 80px;"><i style="flex: 1; background: {{t.c1}};"></i><i style="flex: 1; background: {{t.c2}};"></i><i style="flex: 1; background: {{t.c3}};"></i><i style="flex: .4; background: var(--gold);"></i></span>
            <span style="display: flex; justify-content: space-between; align-items: center; padding: 12px 14px;"><span class="disp" style="font-size: 22px; font-weight: 600;">{{t.name}}</span><span style="{{t.dot}}"></span></span>
            <span style="padding: 0 14px 14px; font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{t.desc}}</span>
          </button>
        </sc-for>
      </div>
    </section>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 20px;" aria-labelledby="h-estudo">
      <h2 id="h-estudo" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Rotina de estudo</h2>
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px;">
        <label style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Meta diária</span><select style="min-height: 44px; font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 12px;"><option>4 horas</option><option>2 horas</option><option>1 hora</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Mínimo pra sequência</span><select style="min-height: 44px; font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 12px;"><option>30 minutos</option><option>15 minutos</option><option>1 hora</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Pomodoro</span><select style="min-height: 44px; font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 12px;"><option>25 / 5 min</option><option>50 / 10 min</option><option>90 / 20 min</option></select></label>
        <label style="display: flex; flex-direction: column; gap: 6px;"><span class="label">Dia de descanso</span><select style="min-height: 44px; font: 400 15px/22px var(--font-sans); color: var(--ink); background: var(--bg); border: 1px solid var(--border-strong); border-radius: 10px; padding: 8px 12px;"><option>Domingo</option><option>Sábado</option><option>Nenhum</option></select></label>
      </div>
    </section>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 4px;" aria-labelledby="h-exp">
      <h2 id="h-exp" style="margin: 0 0 8px; font-size: 20px; line-height: 28px; font-weight: 600;">Experiência</h2>
      <sc-for list="{{toggles}}" as="g" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 12px 0; border-top: 1px solid var(--hairline);">
          <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">{{g.n}}</span><span style="font-size: 13px; line-height: 18px; color: var(--ink-muted);">{{g.d}}</span></span>
          <button role="switch" aria-checked="{{g.on}}" aria-label="{{g.n}}" onClick="{{g.flip}}" style="{{g.track}}"><span style="{{g.knob}}"></span></button>
        </div>
      </sc-for>
    </section>

    <section class="card" style="padding: 24px; display: flex; flex-direction: column; gap: 16px;" aria-labelledby="h-int">
      <h2 id="h-int" style="margin: 0; font-size: 20px; line-height: 28px; font-weight: 600;">Integrações</h2>
      <div style="display: flex; flex-wrap: wrap; gap: 16px; justify-content: space-between; align-items: center;">
        <span style="display: flex; gap: 12px; align-items: center;">
          <span style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--hairline); display: grid; place-items: center;"><svg class="ico" viewBox="0 0 24 24"><path d="M8 2v4 M16 2v4 M3 9h18 M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"></path></svg></span>
          <span style="display: flex; flex-direction: column;"><span style="font-weight: 600;">Google Agenda</span><span style="font-size: 13px; line-height: 18px; color: var(--success);">Conectada · sincronizada há 2 min</span></span>
        </span>
        <button class="btn btn-secondary">Gerenciar</button>
      </div>
    </section>
  </main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["ponderosa","burgundy","camel"],"default":"ponderosa"},"$preview":{"width":1440,"height":1060}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: null, flags: { motion: true, sounds: true, push: true, gcal: true } }; }
  renderVals() {
    var self = this, st = this.state;
    var current = st.pick || this.props.theme || 'ponderosa';
    var effective = current === 'auto' ? 'camel' : current;
    var themes = [
      ['ponderosa', 'Ponderosa', 'Verde floresta, para estudar à noite.', '#0b1f19', 'var(--pine-900)', 'var(--pine-700)'],
      ['burgundy', 'Burgundy', 'Vinho e couro, clima de biblioteca.', '#2a0d13', 'var(--burgundy-700)', '#8a3242'],
      ['camel', 'Camel', 'Claro e quente, para o dia.', '#f3ebdd', 'var(--camel-400)', '#e4d2b6'],
      ['auto', 'Automático', 'Camel de dia, Ponderosa à noite.', '#f3ebdd', 'var(--camel-400)', 'var(--pine-900)']
    ];
    var toggles = [
      ['motion', 'Animações completas', 'Desligado: só fades suaves (segue o sistema por padrão).'],
      ['sounds', 'Som ao fim do pomodoro', 'Um sino discreto, nada de alarme.'],
      ['push', 'Lembretes no navegador', 'Avisa 10 min antes de cada bloco de estudo.'],
      ['gcal', 'Criar blocos no Google Agenda', 'Seus blocos de estudo aparecem na agenda pessoal.']
    ];
    return {
      theme: effective,
      themes: themes.map(function (t) {
        var on = current === t[0];
        return {
          name: t[1], desc: t[2], c1: t[3], c2: t[4], c3: t[5], on: on ? 'true' : 'false',
          pick: function () {
            var go = function () { self.setState({ pick: t[0] }); };
            if (document.startViewTransition) document.startViewTransition(go); else go();
          },
          box: 'padding: 0; display: flex; flex-direction: column; text-align: left; cursor: pointer; overflow: hidden; border-radius: 16px; background: var(--bg); color: var(--ink); font: inherit; transition: border-color 160ms, transform 90ms; border: 1px solid ' + (on ? 'var(--accent)' : 'var(--hairline)') + ';' + (on ? ' box-shadow: 0 0 0 1px var(--accent);' : ''),
          dot: 'width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid ' + (on ? 'var(--accent)' : 'var(--border-strong)') + '; background: ' + (on ? 'var(--accent)' : 'transparent') + '; box-shadow: inset 0 0 0 3px var(--bg);'
        };
      }),
      toggles: toggles.map(function (g) {
        var on = !!st.flags[g[0]];
        return {
          n: g[1], d: g[2], on: on ? 'true' : 'false',
          flip: function () { var f = Object.assign({}, self.state.flags); f[g[0]] = !f[g[0]]; self.setState({ flags: f }); },
          track: 'flex: none; width: 48px; height: 28px; padding: 3px; border-radius: 999px; cursor: pointer; display: flex; transition: background-color 160ms; border: 1px solid ' + (on ? 'var(--accent)' : 'var(--border-strong)') + '; background: ' + (on ? 'var(--accent)' : 'transparent') + '; justify-content: ' + (on ? 'flex-end' : 'flex-start') + ';',
          knob: 'width: 20px; height: 20px; border-radius: 50%; background: ' + (on ? 'var(--on-accent)' : 'var(--border-strong)') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
