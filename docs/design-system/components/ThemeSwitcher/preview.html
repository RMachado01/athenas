<!-- @dsCard group="Personalização" height=230 subtitle="Clique num tema: este card troca de tema ao vivo" -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink);transition:background-color var(--duration-slow) var(--ease-in-out),color var(--duration-slow) var(--ease-in-out)}
  .wrap{padding:var(--space-6)}
  .over{font:600 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);margin-bottom:var(--space-3)}
  .opts{display:flex;gap:var(--space-3);flex-wrap:wrap}
  .opt{width:168px;padding:0;border:1px solid var(--hairline);border-radius:var(--radius-lg);background:var(--surface);cursor:pointer;text-align:left;overflow:hidden;transition:border-color var(--duration-fast),transform var(--duration-instant) var(--ease-out);color:var(--ink)}
  .opt:active{transform:scale(.98)}
  .opt:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  .opt[aria-checked="true"]{border-color:var(--accent)}
  .sw{height:72px;display:flex}
  .sw i{flex:1}
  .sw i:last-child{flex:.35;background:var(--palette-gold-500)}
  .t{padding:var(--space-3);font:600 20px/24px var(--font-display);display:flex;justify-content:space-between;align-items:center}
  .tick{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--border-strong)}
  .opt[aria-checked="true"] .tick{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 3px var(--surface)}
</style>
<div class="wrap">
  <div class="over">Tema</div>
  <div class="opts" role="radiogroup" aria-label="Tema">
    <button class="opt" role="radio" data-t="ponderosa"><div class="sw"><i style="background:#0b1f19"></i><i style="background:var(--palette-pine-900)"></i><i style="background:var(--palette-pine-700)"></i><i></i></div><div class="t">Ponderosa<span class="tick"></span></div></button>
    <button class="opt" role="radio" data-t="burgundy"><div class="sw"><i style="background:#2a0d13"></i><i style="background:var(--palette-burgundy-700)"></i><i style="background:#8a3242"></i><i></i></div><div class="t">Burgundy<span class="tick"></span></div></button>
    <button class="opt" role="radio" data-t="camel"><div class="sw"><i style="background:#f3ebdd"></i><i style="background:var(--palette-camel-400)"></i><i style="background:#e4d2b6"></i><i></i></div><div class="t">Camel<span class="tick"></span></div></button>
  </div>
</div>
<script>
  var root=document.documentElement,opts=document.querySelectorAll('.opt');
  function sync(){var cur=root.getAttribute('data-theme')||'ponderosa';opts.forEach(function(o){o.setAttribute('aria-checked',o.dataset.t===cur);});}
  opts.forEach(function(o){o.addEventListener('click',function(){var go=function(){root.setAttribute('data-theme',o.dataset.t);sync();};if(document.startViewTransition){document.startViewTransition(go);}else{go();}});});
  sync();
</script>
