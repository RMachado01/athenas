<!-- @dsCard group="Ações" height=120 subtitle="Primário dourado, secundário com filete, ghost" -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);}
  .row{display:flex;gap:var(--space-3);align-items:center;flex-wrap:wrap;padding:var(--space-6);}
  .btn{font:600 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:10px var(--space-4);border:1px solid transparent;cursor:pointer;display:inline-flex;gap:var(--space-2);align-items:center;transition:background-color var(--duration-instant) var(--ease-out),transform var(--duration-instant) var(--ease-out),border-color var(--duration-instant);}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  .primary{background:var(--accent);color:var(--on-accent)}
  .primary:hover{background:var(--accent-hover)}
  .secondary{background:transparent;color:var(--ink);border-color:var(--border-strong)}
  .secondary:hover{border-color:var(--accent);color:var(--accent)}
  .ghost{background:transparent;color:var(--ink-muted)}
  .ghost:hover{background:var(--surface-raised);color:var(--ink)}
  .btn[disabled]{opacity:.45;cursor:not-allowed;transform:none}
  svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
</style>
<div class="row">
  <button class="btn primary"><svg viewBox="0 0 24 24"><polygon points="6 4 20 12 6 20 6 4"/></svg>Começar foco</button>
  <button class="btn secondary"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova tarefa</button>
  <button class="btn ghost">Cancelar</button>
  <button class="btn primary" disabled>Salvando…</button>
</div>
