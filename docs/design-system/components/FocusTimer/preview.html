<!-- @dsCard group="Estudo" height=340 subtitle="Pomodoro: clique em Iniciar" -->
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Instrument+Sans:wght@400;600&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:var(--bg);font-family:var(--font-sans);color:var(--ink)}
  .stage{padding:var(--space-6);display:grid;place-items:center}
  .card{width:360px;background:var(--surface);border:1px solid var(--hairline);border-radius:var(--radius-xl);padding:var(--space-8) var(--space-6);text-align:center;box-shadow:var(--shadow-modal)}
  .over{font:600 11px/16px var(--font-sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
  .task{font:600 22px/28px var(--font-display);margin:var(--space-1) 0 var(--space-4)}
  .time{font:500 72px/76px var(--font-mono);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .track{height:3px;background:var(--brand-soft);border-radius:var(--radius-pill);margin:var(--space-4) 0;overflow:hidden}
  .fill{height:100%;width:0;background:var(--accent);transition:width 1s linear}
  .dots{display:flex;gap:6px;justify-content:center;margin-bottom:var(--space-6)}
  .dots i{width:8px;height:8px;border-radius:50%;background:var(--hairline)}
  .dots i.on{background:var(--accent)}
  .acts{display:flex;gap:var(--space-2);justify-content:center}
  .btn{font:600 14px/20px var(--font-sans);border-radius:var(--radius-md);padding:12px var(--space-6);border:1px solid transparent;cursor:pointer;transition:transform var(--duration-instant) var(--ease-out)}
  .btn:active{transform:scale(.98)}
  .btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
  .primary{background:var(--accent);color:var(--on-accent)}
  .secondary{background:transparent;color:var(--ink);border-color:var(--border-strong)}
</style>
<div class="stage">
  <div class="card" role="timer" aria-live="off">
    <div class="over">Foco · sessão 3 de 4</div>
    <div class="task">Window functions no SQL</div>
    <div class="time" id="t">25:00</div>
    <div class="track"><div class="fill" id="f"></div></div>
    <div class="dots" aria-label="2 sessões concluídas"><i class="on"></i><i class="on"></i><i></i><i></i></div>
    <div class="acts"><button class="btn primary" id="go">Iniciar</button><button class="btn secondary">Pular pausa</button></div>
  </div>
</div>
<script>
  var total=1500,left=1500,iv=null,t=document.getElementById('t'),f=document.getElementById('f'),go=document.getElementById('go');
  function draw(){t.textContent=String(Math.floor(left/60)).padStart(2,'0')+':'+String(left%60).padStart(2,'0');f.style.width=((total-left)/total*100)+'%';}
  go.addEventListener('click',function(){if(iv){clearInterval(iv);iv=null;go.textContent='Continuar';return;}go.textContent='Pausar';iv=setInterval(function(){left=Math.max(0,left-15);draw();if(!left){clearInterval(iv);iv=null;}},1000);});
</script>
